<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set Password</title>
    <style>
        body {
            font-family: system-ui, Arial;
            max-width: 520px;
            margin: 48px auto;
            padding: 0 16px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
        }

        .msg {
            margin-top: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Set your password</h2>

    <div class="card">
        <div id="info" style="color:#555;"></div>

        <label>New password</label>
        <input id="pwd" type="password" placeholder="Enter new password" />

        <label>Confirm password</label>
        <input id="pwd2" type="password" placeholder="Confirm new password" />

        <button id="btn">Set Password</button>

        <div class="msg" id="msg"></div>
    </div>

    <script>
    const qs = new URLSearchParams(window.location.search);
    const userId = qs.get("userId");
    const token = qs.get("token");

    const info = document.getElementById("info");
    const msg = document.getElementById("msg");

    if (!userId || !token) {
      info.textContent = "Missing userId or token in URL.";
      document.getElementById("btn").disabled = true;
    } else {
      info.textContent = "Link loaded. Please set a new password.";
    }

    document.getElementById("btn").addEventListener("click", async () => {
      msg.textContent = "";
      const p1 = document.getElementById("pwd").value;
      const p2 = document.getElementById("pwd2").value;

      if (!p1 || p1.length < 8) {
        msg.textContent = "Password must be at least 8 characters.";
        return;
      }
      if (p1 !== p2) {
        msg.textContent = "Passwords do not match.";
        return;
      }

      try {
        const res = await fetch("/api/Identity/Auths/set-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId: userId,
            token: token,
            newPassword: p1
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = (data.message || "Failed to set password.") + " (HTTP " + res.status + ")";
          return;
        }

        msg.textContent = data.message || "Password set successfully. You can now login.";
      } catch (e) {
        msg.textContent = "Network error: " + e;
      }
    });
    </script>
</body>
</html>
